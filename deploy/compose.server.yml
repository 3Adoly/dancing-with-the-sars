# Production-ish deployment on the shared team server (164.92.235.173).
# The server already runs other services (Apache on 80/443, Postgres on 5432, apps on 8080/8081, …): this stack only uses port 8090
# and is capped in memory/CPU so it cannot starve them.
#
#   cd /opt/dancing-with-the-sars && git pull --ff-only
#   VERSION=$(git rev-parse --short HEAD) docker compose -f deploy/compose.server.yml up -d --build
#
# Today the API runs in "fixture mode" (no database). When Mohammed's DB lands (M1–M3, then A2), add a `db`
# service here (postgis/postgis:17-3.5, bound to 127.0.0.1 on a free port: 5432 is taken) and set DATABASE_URL.
name: dwts
services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
      args:
        VERSION: ${VERSION:-dev}
    image: dwts-api:${VERSION:-dev}
    container_name: dwts-api
    restart: unless-stopped
    ports:
      - "8090:8080"   # host 8090 (8080/8081 are used by other apps on this server) → container 8080
    environment:
      HTTP_ADDR: ":8080"
      LOG_FORMAT: json
      LOG_LEVEL: info
      # Public read-only API, no cookies/credentials: any origin may read it (frontend dev + deployed UI).
      CORS_ORIGINS: "*"
      STATS_FIXTURE: /app/testdata/stats_fixture.json
      INCIDENTS_FIXTURE: /app/testdata/incidents_fixture.json
      STORIES_DIR: /app/testdata/stories
    mem_limit: 256m
    cpus: 0.5
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
